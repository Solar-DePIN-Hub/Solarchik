name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: tsc-${{ hashFiles('tsconfig.json', 'src/**/*.ts', 'src/**/*.tsx', 'server/**/*.ts', 'server/**/*.mjs') }}
          restore-keys: tsc-
      - run: npm ci
      - run: npm test
